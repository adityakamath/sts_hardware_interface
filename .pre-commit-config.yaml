default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # No .clang-format here, and clang-tidy needs a full compile_commands.json to run
  # meaningfully (that's what the clang-tidy CI workflow is for) - too heavy for a
  # commit-time hook. These two catch the cheap, language-agnostic stuff.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^external/
      - id: end-of-file-fixer
        exclude: ^external/

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz - Control loop frequency

    # Joint State Broadcaster - Publishes joint states to /joint_states and /dynamic_joint_states
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # State Interfaces Broadcaster - Publishes health interfaces for motor_diagnostics_node
    state_interfaces_broadcaster:
      type: state_interfaces_broadcaster/StateInterfacesBroadcaster

    # Velocity Controller - Commands velocity to the wheel joint
    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

# Joint State Broadcaster configuration
# Publishes standard state (position, velocity, effort) to /joint_states
# Publishes all configured interfaces to /dynamic_joint_states
joint_state_broadcaster:
  ros__parameters:
    joints:
      - wheel_joint

    # State interfaces to publish to /dynamic_joint_states
    # IMPORTANT: Must explicitly list ALL interfaces, including standard ones (position, velocity, effort)
    # Uncomment and add custom interfaces (voltage, temperature, current, is_moving) if needed
    interfaces:
      - position
      - velocity
      - effort
      # - voltage        # Supply voltage (volts)
      # - temperature    # Internal temperature (°C)
      # - current        # Motor current draw (amperes)
      # - is_moving      # Motion status (1.0=moving, 0.0=stopped)

# State Interfaces Broadcaster configuration
# Publishes the listed <joint>/<interface> values to /state_interfaces_broadcaster/values
# (names on /state_interfaces_broadcaster/names); read by motor_diagnostics_node on Kilted and Lyrical
state_interfaces_broadcaster:
  ros__parameters:
    interfaces:
      - wheel_joint/effort
      - wheel_joint/voltage
      - wheel_joint/temperature
      - wheel_joint/current
      - wheel_joint/is_moving

# Velocity Controller configuration (Mode 1)
velocity_controller:
  ros__parameters:
    joints:
      - wheel_joint

    interface_name: velocity

    # Command interface used by this controller
    command_interfaces:
      - velocity

    # State interfaces monitored by this controller
    state_interfaces:
      - position
      - velocity

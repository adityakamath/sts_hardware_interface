<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 444" width="780" height="444" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace">
  <defs>
    <marker id="ah"    markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto"><polygon points="0,0 7,2.5 0,5" fill="#585B54"/></marker>
    <marker id="ah-ok" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto"><polygon points="0,0 7,2.5 0,5" fill="#3A8A52"/></marker>
    <marker id="ah-hi" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto"><polygon points="0,0 7,2.5 0,5" fill="#A04000"/></marker>
  </defs>
  <rect width="780" height="444" fill="#ECEEE8"/>

      <g transform="translate(12,8)">

        <!-- ── LAYER BACKGROUNDS ── -->
        <rect x="0" y="8"   width="756" height="72" rx="5" fill="#F5F7F2" stroke="#AEB3A6" stroke-width="1"/>
        <rect x="0" y="102" width="756" height="220" rx="5" fill="#F5F7F2" stroke="#AEB3A6" stroke-width="1"/>
        <rect x="0" y="344" width="756" height="80"  rx="5" fill="#F5F7F2" stroke="#AEB3A6" stroke-width="1"/>

        <text x="10" y="21"  font-size="8" font-weight="700" letter-spacing="0.10em" fill="#404340">ROS 2 CONTROL</text>
        <text x="10" y="115" font-size="8" font-weight="700" letter-spacing="0.10em" fill="#404340">STS HARDWARE INTERFACE</text>
        <text x="10" y="357" font-size="8" font-weight="700" letter-spacing="0.10em" fill="#404340">PHYSICAL HARDWARE  ·  TTL half-duplex serial bus</text>

        <!-- ── LAYER 1: ROS 2 CONTROL NODES ── -->
        <!-- JointTrajectoryController (mode 0 · position) -->
        <rect x="8" y="28" width="179" height="44" rx="4" fill="#D8DDD3" stroke="#7C8076" stroke-width="1"/>
        <text x="98" y="39" text-anchor="middle" font-size="9" font-weight="600" fill="#141612">JointTrajectoryController</text>
        <line x1="8" y1="45" x2="187" y2="45" stroke="#7C8076" stroke-width="0.75"/>
        <text x="98" y="55" text-anchor="middle" font-size="8" fill="#404340">mode 0</text>
        <text x="98" y="65" text-anchor="middle" font-size="8" fill="#404340">position</text>

        <!-- JointGroupVelocityController (mode 1 · velocity) -->
        <rect x="195" y="28" width="179" height="44" rx="4" fill="#D8DDD3" stroke="#7C8076" stroke-width="1"/>
        <text x="285" y="39" text-anchor="middle" font-size="9" font-weight="600" fill="#141612">JointGroupVelocityController</text>
        <line x1="195" y1="45" x2="374" y2="45" stroke="#7C8076" stroke-width="0.75"/>
        <text x="285" y="55" text-anchor="middle" font-size="8" fill="#404340">mode 1</text>
        <text x="285" y="65" text-anchor="middle" font-size="8" fill="#404340">velocity</text>

        <!-- JointGroupEffortController (mode 2 · effort/PWM) -->
        <rect x="382" y="28" width="179" height="44" rx="4" fill="#D8DDD3" stroke="#7C8076" stroke-width="1"/>
        <text x="472" y="39" text-anchor="middle" font-size="9" font-weight="600" fill="#141612">JointGroupEffortController</text>
        <line x1="382" y1="45" x2="561" y2="45" stroke="#7C8076" stroke-width="0.75"/>
        <text x="472" y="55" text-anchor="middle" font-size="8" fill="#404340">mode 2</text>
        <text x="472" y="65" text-anchor="middle" font-size="8" fill="#404340">effort</text>

        <!-- joint_state_broadcaster (ros2_control broadcaster) -->
        <rect x="569" y="28" width="179" height="44" rx="4" fill="#D8DDD3" stroke="#7C8076" stroke-width="1"/>
        <text x="659" y="39" text-anchor="middle" font-size="9" font-weight="600" fill="#141612">joint_state_broadcaster</text>
        <line x1="569" y1="45" x2="748" y2="45" stroke="#7C8076" stroke-width="0.75"/>
        <text x="659" y="55" text-anchor="middle" font-size="8" fill="#404340">pub → /joint_states</text>
        <text x="659" y="65" text-anchor="middle" font-size="8" fill="#404340">pub → /dynamic_joint_states</text>

        <!-- ── INTER-LAYER ARROWS: ROS 2 ↔ HW INTERFACE ── -->
        <!-- command interfaces down — x=285 = center of 3 controller columns -->
        <line x1="285" y1="81" x2="285" y2="100" stroke="#585B54" stroke-width="1.5" marker-end="url(#ah)"/>
        <!-- state interfaces up — x=659 = center of joint_state_broadcaster column -->
        <line x1="659" y1="100" x2="659" y2="81" stroke="#585B54" stroke-width="1.5" marker-end="url(#ah)"/>
        <text x="292" y="94"  text-anchor="start" font-size="7.5" fill="#404340">cmd</text>
        <text x="666" y="94"  text-anchor="start" font-size="7.5" fill="#404340">state</text>

        <!-- ── LAYER 2: HW INTERFACE SUB-BOXES ── -->

        <!-- on_configure(): 5 content lines + header → h=106 -->
        <rect x="8"   y="122" width="190" height="106" rx="4" fill="#D8DDD3" stroke="#7C8076" stroke-width="1"/>
        <text x="103" y="137" text-anchor="middle" font-size="9.5" font-weight="700" fill="#141612">on_configure()</text>
        <line x1="8"  y1="141" x2="198" y2="141" stroke="#7C8076" stroke-width="0.75"/>
        <text x="20"  y="155" font-size="8.5" fill="#404340">· /emergency_stop service</text>
        <text x="20"  y="168" font-size="8.5" fill="#404340">· open serial port</text>
        <text x="20"  y="181" font-size="8.5" fill="#404340">· ping all motors</text>
        <text x="20"  y="194" font-size="8.5" fill="#404340">· unlockEeprom per joint →</text>
        <text x="20"  y="207" font-size="8.5" fill="#404340">  write PID / protection /</text>
        <text x="20"  y="220" font-size="8.5" fill="#404340">  return_delay → lockEeprom</text>

        <!-- read(): FeedBack() per joint (not SyncRead) -->
        <rect x="208" y="122" width="158" height="106" rx="4" fill="#D8DDD3" stroke="#7C8076" stroke-width="1"/>
        <text x="287" y="137" text-anchor="middle" font-size="9.5" font-weight="700" fill="#141612">read()</text>
        <line x1="208" y1="141" x2="366" y2="141" stroke="#7C8076" stroke-width="0.75"/>
        <text x="220" y="155" font-size="8.5" fill="#404340">FeedBack() per joint</text>
        <text x="220" y="168" font-size="8.5" fill="#404340">(incl. read-only motors)</text>
        <text x="220" y="185" font-size="8.5" fill="#404340">7 state interfaces:</text>
        <text x="220" y="198" font-size="8.5" fill="#404340">pos · vel · effort</text>
        <text x="220" y="211" font-size="8.5" fill="#404340">voltage · temp · current</text>
        <text x="220" y="224" font-size="8.5" fill="#404340">is_moving</text>

        <!-- write(): SyncWrite conditional on use_sync_write + >1/group -->
        <rect x="376" y="122" width="184" height="106" rx="4" fill="#D8DDD3" stroke="#7C8076" stroke-width="1"/>
        <text x="468" y="137" text-anchor="middle" font-size="9.5" font-weight="700" fill="#141612">write()</text>
        <line x1="376" y1="141" x2="560" y2="141" stroke="#7C8076" stroke-width="0.75"/>
        <text x="388" y="155" font-size="8.5" fill="#404340">SyncWrite per mode group</text>
        <text x="388" y="167" font-size="8.5" fill="#404340">(use_sync_write + &gt;1/group)</text>
        <text x="388" y="181" font-size="8.5" fill="#404340">· mode 0 → position</text>
        <text x="388" y="194" font-size="8.5" fill="#404340">· mode 1 → velocity</text>
        <text x="388" y="207" font-size="8.5" fill="#404340">· mode 2 → PWM</text>
        <text x="388" y="222" font-size="8.5" fill="#622800">read-only excluded (all)</text>

        <!-- on_activate() h=62 -->
        <rect x="570" y="122" width="178" height="74" rx="4" fill="#D4EFDC" stroke="#3A8A52" stroke-width="1"/>
        <text x="659" y="137" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0C5022">on_activate()</text>
        <line x1="570" y1="141" x2="748" y2="141" stroke="#3A8A52" stroke-width="0.75"/>
        <text x="582" y="155" font-size="8.5" fill="#0C5022">InitMotor() per joint:</text>
        <text x="582" y="168" font-size="8.5" fill="#0C5022">· commanded: torque=1</text>
        <text x="582" y="181" font-size="8.5" fill="#0C5022">· read-only:  torque=0</text>

        <!-- on_deactivate() h=62 (individual stop_motor(), not SyncWrite) -->
        <rect x="570" y="206" width="178" height="74" rx="4" fill="#FAE0E0" stroke="#C04444" stroke-width="1"/>
        <text x="659" y="221" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6C0E0E">on_deactivate()</text>
        <line x1="570" y1="225" x2="748" y2="225" stroke="#C04444" stroke-width="0.75"/>
        <text x="582" y="239" font-size="8.5" fill="#6C0E0E">stop_motor() per joint</text>
        <text x="582" y="252" font-size="8.5" fill="#6C0E0E">(individual writes)</text>
        <text x="582" y="265" font-size="8.5" fill="#6C0E0E">EnableTorque(0) all</text>

        <!-- /emergency_stop service (created in on_configure, owned by STS HW interface) -->
        <rect x="8" y="236" width="272" height="44" rx="4" fill="#D8DDD3" stroke="#7C8076" stroke-width="1"/>
        <text x="144" y="249" text-anchor="middle" font-size="9.5" font-weight="700" fill="#141612">/emergency_stop</text>
        <line x1="8" y1="253" x2="280" y2="253" stroke="#7C8076" stroke-width="0.75"/>
        <text x="144" y="266" text-anchor="middle" font-size="8" fill="#404340">std_srvs/SetBool · all motors stop · torque=0</text>

        <!-- motor_diagnostics_node (separate launch, same package) -->
        <rect x="288" y="236" width="272" height="44" rx="4" fill="#D8DDD3" stroke="#7C8076" stroke-width="1"/>
        <text x="424" y="249" text-anchor="middle" font-size="9.5" font-weight="700" fill="#141612">motor_diagnostics_node</text>
        <line x1="288" y1="253" x2="560" y2="253" stroke="#7C8076" stroke-width="0.75"/>
        <text x="424" y="263" text-anchor="middle" font-size="8" fill="#404340">sub ← /dynamic_joint_states</text>
        <text x="424" y="274" text-anchor="middle" font-size="8" fill="#404340">pub → /diagnostics</text>

        <!-- Mock mode (dashed) – full inner width -->
        <rect x="8" y="288" width="740" height="26" rx="4"
              fill="transparent" stroke="#7C8076" stroke-width="1" stroke-dasharray="5,3"/>
        <text x="378" y="305" text-anchor="middle" font-size="8.5" fill="#404340">
          Mock Mode  (enable_mock_mode=true)  ·  all serial I/O bypassed  ·  state simulated in software
        </text>

        <!-- ── INTER-LAYER ARROW: HW INTERFACE → PHYSICAL ── -->
        <line x1="370" y1="323" x2="370" y2="342" stroke="#585B54" stroke-width="1.5" marker-end="url(#ah)"/>
        <text x="377" y="334" text-anchor="start" font-size="7.5" fill="#404340">SCServo SDK</text>

        <!-- ── LAYER 3: PHYSICAL HARDWARE ── -->
        <!-- Serial port -->
        <rect x="8"   y="364" width="100" height="46" rx="4" fill="#D8DDD3" stroke="#7C8076" stroke-width="1"/>
        <text x="58"  y="383" text-anchor="middle" font-size="9.5" font-weight="600" fill="#141612">/dev/ttyACM0</text>
        <text x="58"  y="397" text-anchor="middle" font-size="8.5"  fill="#404340">USB → TTL serial</text>

        <line x1="110" y1="387" x2="124" y2="387" stroke="#585B54" stroke-width="1.5" marker-end="url(#ah)"/>

        <!-- Motor 1 -->
        <rect x="128" y="364" width="104" height="46" rx="4" fill="#D8DDD3" stroke="#7C8076" stroke-width="1"/>
        <text x="180" y="383" text-anchor="middle" font-size="9.5" font-weight="600" fill="#141612">Motor 1</text>
        <text x="180" y="397" text-anchor="middle" font-size="8.5"  fill="#404340">mode 0 · position</text>

        <!-- Motor 2 -->
        <rect x="244" y="364" width="104" height="46" rx="4" fill="#D8DDD3" stroke="#7C8076" stroke-width="1"/>
        <text x="296" y="383" text-anchor="middle" font-size="9.5" font-weight="600" fill="#141612">Motor 2</text>
        <text x="296" y="397" text-anchor="middle" font-size="8.5"  fill="#404340">mode 1 · velocity</text>

        <!-- Motor 3 -->
        <rect x="360" y="364" width="104" height="46" rx="4" fill="#D8DDD3" stroke="#7C8076" stroke-width="1"/>
        <text x="412" y="383" text-anchor="middle" font-size="9.5" font-weight="600" fill="#141612">Motor 3</text>
        <text x="412" y="397" text-anchor="middle" font-size="8.5"  fill="#404340">mode 2 · PWM</text>

        <!-- Motor N: read-only = no command interface -->
        <rect x="476" y="364" width="136" height="46" rx="4" fill="#FCDCC0" stroke="#A04000" stroke-width="1.5"/>
        <text x="544" y="380" text-anchor="middle" font-size="9.5" font-weight="600" fill="#622800">Motor N · read-only</text>
        <text x="544" y="393" text-anchor="middle" font-size="8.5"  fill="#622800">no command interface</text>

        <text x="622" y="383" font-size="8.5" fill="#404340">1–253 motors</text>
        <text x="622" y="397" font-size="8.5" fill="#404340">per serial bus</text>

      </g>
    
</svg>
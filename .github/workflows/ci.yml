name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: clang-tidy (${{ matrix.ros_distro }})
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [kilted, jazzy]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang++-18 clang-tidy-18
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      - name: Install ROS 2 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ros-${{ matrix.ros_distro }}-hardware-interface \
            ros-${{ matrix.ros_distro }}-pluginlib \
            ros-${{ matrix.ros_distro }}-rclcpp \
            ros-${{ matrix.ros_distro }}-rclcpp-lifecycle

      - name: Create workspace
        run: |
          mkdir -p ~/ros2_ws/src
          cp -r ${{ github.workspace }} ~/ros2_ws/src/sts_hardware_interface

      - name: Build with compile_commands.json
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          cd ~/ros2_ws
          colcon build \
            --packages-select sts_hardware_interface \
            --cmake-args \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER=clang-18 \
              -DCMAKE_CXX_COMPILER=clang++-18

      - name: Run clang-tidy
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          cd ~/ros2_ws/src/sts_hardware_interface

          mkdir -p clang-tidy-results

          EXIT_CODE=0

          echo "Running clang-tidy on source files..."
          for file in $(find src include -name "*.cpp" -o -name "*.hpp"); do
            echo "Checking: $file"
            clang-tidy \
              -p ~/ros2_ws/build/sts_hardware_interface \
              "$file" \
              > clang-tidy-results/$(basename $file).txt 2>&1 || EXIT_CODE=1
          done

          cat clang-tidy-results/*.txt > clang-tidy-results/full-report.txt

          echo "================================"
          echo "clang-tidy Summary"
          echo "================================"
          cat clang-tidy-results/full-report.txt

          exit $EXIT_CODE

      - name: Upload clang-tidy results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-results-${{ matrix.ros_distro }}
          path: ~/ros2_ws/src/sts_hardware_interface/clang-tidy-results/

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const reportPath = process.env.HOME + '/ros2_ws/src/sts_hardware_interface/clang-tidy-results/full-report.txt';

            let report = 'clang-tidy found issues:\n\n```\n';
            try {
              report += fs.readFileSync(reportPath, 'utf8');
            } catch (error) {
              report += 'Error reading report file';
            }
            report += '\n```';

            if (report.length > 65000) {
              report = report.substring(0, 65000) + '\n... (truncated)';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  test:
    name: colcon test (ros:${{ matrix.ros_distro }})
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [kilted, jazzy]
    runs-on: ubuntu-latest
    container: ros:${{ matrix.ros_distro }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          path: src/sts_hardware_interface

      - name: Install ROS dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            ros-${{ matrix.ros_distro }}-ament-cmake-gtest \
            ros-${{ matrix.ros_distro }}-ament-lint-auto \
            ros-${{ matrix.ros_distro }}-ament-lint-common \
            ros-${{ matrix.ros_distro }}-control-msgs \
            ros-${{ matrix.ros_distro }}-controller-manager \
            ros-${{ matrix.ros_distro }}-diagnostic-msgs \
            ros-${{ matrix.ros_distro }}-effort-controllers \
            ros-${{ matrix.ros_distro }}-hardware-interface \
            ros-${{ matrix.ros_distro }}-joint-state-broadcaster \
            ros-${{ matrix.ros_distro }}-joint-trajectory-controller \
            ros-${{ matrix.ros_distro }}-launch-testing-ament-cmake \
            ros-${{ matrix.ros_distro }}-launch-testing-ros \
            ros-${{ matrix.ros_distro }}-pluginlib \
            ros-${{ matrix.ros_distro }}-rclcpp \
            ros-${{ matrix.ros_distro }}-rclcpp-lifecycle \
            ros-${{ matrix.ros_distro }}-robot-state-publisher \
            ros-${{ matrix.ros_distro }}-std-srvs \
            ros-${{ matrix.ros_distro }}-velocity-controllers \
            ros-${{ matrix.ros_distro }}-xacro

      # gtest (test_conversions, test_hardware_interface) and the launch tests
      # (single_motor_velocity, single_motor_position, motor_diagnostics, mixed_mode) all run
      # here, alongside ament_lint_auto's cpplint/uncrustify/cppcheck/xmllint/copyright checks -
      # clang-tidy's own static analysis runs in the lint job above instead.
      - name: colcon build
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          colcon build --packages-select sts_hardware_interface

      - name: colcon test
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          . install/setup.sh
          colcon test --packages-select sts_hardware_interface --event-handlers console_direct+
          colcon test-result --verbose

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: colcon-logs-${{ matrix.ros_distro }}
          path: log

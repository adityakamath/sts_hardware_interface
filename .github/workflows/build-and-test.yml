name: build-and-test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ros_distribution: [jazzy]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }}

      # gtest (test_conversions, test_hardware_interface) and the launch tests
      # (single_motor_velocity, single_motor_position, motor_diagnostics, mixed_mode) all run
      # as part of colcon test here, alongside ament_lint_auto's cpplint/uncrustify/cppcheck/
      # xmllint/copyright checks - clang-tidy's own static analysis stays in its own workflow.
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: sts_hardware_interface
          target-ros2-distro: ${{ matrix.ros_distribution }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colcon-logs-${{ matrix.ros_distribution }}
          path: ros_ws/log

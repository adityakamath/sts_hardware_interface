name: build-and-test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: colcon test (ros:kilted)
    runs-on: ubuntu-latest
    container: ros:kilted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: src/sts_hardware_interface

      - name: Install ROS dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            ros-kilted-ament-cmake-gtest \
            ros-kilted-ament-lint-auto \
            ros-kilted-ament-lint-common \
            ros-kilted-control-msgs \
            ros-kilted-controller-manager \
            ros-kilted-diagnostic-msgs \
            ros-kilted-effort-controllers \
            ros-kilted-hardware-interface \
            ros-kilted-joint-state-broadcaster \
            ros-kilted-joint-trajectory-controller \
            ros-kilted-launch-testing-ament-cmake \
            ros-kilted-launch-testing-ros \
            ros-kilted-pluginlib \
            ros-kilted-rclcpp \
            ros-kilted-rclcpp-lifecycle \
            ros-kilted-robot-state-publisher \
            ros-kilted-std-srvs \
            ros-kilted-velocity-controllers \
            ros-kilted-xacro

      # gtest (test_conversions, test_hardware_interface) and the launch tests
      # (single_motor_velocity, single_motor_position, motor_diagnostics, mixed_mode) all run
      # here, alongside ament_lint_auto's cpplint/uncrustify/cppcheck/xmllint/copyright checks -
      # clang-tidy's own static analysis stays in its own workflow.
      - name: colcon build
        run: |
          . /opt/ros/kilted/setup.sh
          colcon build --packages-select sts_hardware_interface

      - name: colcon test
        run: |
          . /opt/ros/kilted/setup.sh
          . install/setup.sh
          colcon test --packages-select sts_hardware_interface --event-handlers console_direct+
          colcon test-result --verbose

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colcon-logs
          path: log

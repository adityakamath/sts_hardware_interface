version: 2
updates:
  # Keep GitHub Actions up to date; bundled into one PR and auto-merged by
  # .github/workflows/dependabot-auto-merge.yml once CI passes.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
